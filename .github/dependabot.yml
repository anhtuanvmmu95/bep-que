# .github/dependabot.yml
# Cấu hình GitHub Dependabot tự động quét và nâng cấp dependencies bảo mật cho Bếp Quê
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    reviewers:
      - "team-security"
    labels:
      - "dependencies"
      - "security"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Khóa các phiên bản major có breaking change nếu chưa kiểm thử
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
