name: Security & Vulnerability Audit Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Quét định kỳ mỗi thứ Hai vào lúc 02:00 sáng (UTC)
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency Audit & Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. NPM Production Security Audit
        run: |
          echo "Kiểm tra lỗ hổng bảo mật trên toàn bộ dependencies production..."
          npm audit --omit=dev --audit-level=high

      - name: 5. Snyk Security Scan (SAST & SCA)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable

      - name: 6. Static Type Check & Code Linter
        run: |
          npx tsc --noEmit

      - name: 7. Run Security & Regression Test Suites
        run: |
          npm test

      - name: 8. Verify Production Build (Source Maps Disabled)
        env:
          NODE_ENV: production
        run: |
          npm run build
          # Kiểm tra đảm bảo không có file *.map trong thư mục static bundle
          if find .next/static -name "*.map" | grep -q .; then
            echo "CẢNH BÁO: Phát hiện file source map (*.map) trong bản build production!"
            exit 1
          else
            echo "Xác nhận thành công: Toàn bộ source maps đã được tắt trên production."
          fi
